[project]
name = "local-docs-viewer"
version = "0.1.0"
description = "Local-only web viewer for a docs folder (read-only unless --allow-edit)"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sse-starlette>=2.1",
    "watchfiles>=0.24",
    "openpyxl>=3.1",
    "playwright>=1.64.0",
    "python-multipart>=0.0.32",
]

[project.scripts]
viewer = "viewer.cli:main"

[dependency-groups]
# Desktop build only (desktop/scripts/build-server.sh, uv run --group build --locked): exact pins,
# hashes in uv.lock. Not installed by a plain `uv sync`.
build = [
    "pyinstaller==6.22.3",
    "pyinstaller-hooks-contrib==2026.9",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server/viewer"]

[tool.pytest.ini_options]
testpaths = ["server/tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]
